name: 部署 Hexo 博客

on:
  push:
    branches:
      - main  # 当推送到main分支时触发，如果您的默认分支是master，请修改为master
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false  # 如果主题是通过submodule引入的，请改为true
          
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用Node.js 20 LTS版本
          
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          
      - name: 获取 pnpm 缓存目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
          
      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        
      - name: 编译 Less 样式
        run: pnpm run compile-less
        
      - name: 清理缓存
        run: pnpm run clean
        
      - name: 生成静态文件
        run: pnpm run build
        
      - name: Gulp 压缩优化
        run: pnpm run gulp
        
      - name: 配置 Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: 部署到 GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd public
          git init
          git add -A
          git commit -m "部署于 $(date '+%Y-%m-%d %H:%M:%S')"
          git push -f https://${{ secrets.GH_TOKEN }}@github.com/shixna/shixna.github.io.git main
