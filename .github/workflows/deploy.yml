name: 部署 Hexo 博客

on:
  push:
    branches:
      - main  # 当推送到main分支时触发，如果您的默认分支是master，请修改为master
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来推送代码
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false  # 如果主题是通过submodule引入的，请改为true
          
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用Node.js 20 LTS版本
          
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: 获取 pnpm 缓存目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
          
      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        
      - name: 编译 Less 样式
        run: pnpm run compile-less
        
      - name: 清理缓存
        run: pnpm run clean
        
      - name: 生成静态文件
        run: pnpm run build
        
      - name: Gulp 压缩优化
        run: pnpm run gulp
        
      - name: 配置 Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: 部署到 GitHub Pages
        env:
          # 优先使用 GH_TOKEN（Personal Access Token），如果没有配置则使用 GITHUB_TOKEN
          DEPLOY_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init
          git checkout -b main
          git add -A
          git commit -m "部署于 $(date '+%Y-%m-%d %H:%M:%S')"
          # 使用 x-access-token 作为用户名，这是 GitHub Actions 推荐的方式
          # 如果 remote 已存在则先删除，确保使用正确的地址
          git remote remove origin 2>/dev/null || true
          git remote add origin https://x-access-token:${DEPLOY_TOKEN}@github.com/zhbCloud/zhbcloud.github.io.git
          git push -f origin main
